[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurometbench-ref"
version = "1.0.1"
description = "Patient-aware validation, claim-admissibility, and numerical auditing utilities for NeuroMetBench"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Abdsalam Bitar"}]
dependencies = [
  "numpy==2.4.6",
  "scipy==1.17.1",
  "pandas==3.0.5",
]

[project.scripts]
neurometbench-ref = "neurometbench_ref.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neurometbench_ref = ["fixtures/*.json"]
