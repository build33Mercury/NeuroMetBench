name: Sync NeuroMetBench v2.0.0 release notes

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  sync-release-notes:
    if: contains(github.event.head_commit.message, 'Sync NeuroMetBench v2.0.0 release notes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update public release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v2.0.0 \
            --title 'NeuroMetBench v2.0.0' \
            --notes-file releases/2.0.0/RELEASE_NOTES.md
