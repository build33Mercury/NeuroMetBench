name: Temporary v2.1.2 metabolome acquisition

on:
  push:
    branches:
      - tmp-v2.1.2-metabolome-acquisition

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Acquire official/public GBM metabolome table
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          URL1='https://pmc.ncbi.nlm.nih.gov/articles/PMC8044053/bin/NIHMS1665743-supplement-3.xlsx'
          URL2='https://media.githubusercontent.com/media/cBioPortal/datahub/refs/heads/master/public/gbm_cptac_2021/data_metabolome_quantification.txt'
          SCRIPT1=''
          SCRIPT2=''
          if curl -fL --retry 4 --retry-all-errors "$URL1" -o table_s2.xlsx; then
            python -m pip install --quiet openpyxl
            printf '%s' "$SCRIPT1" | base64 -d > extract.py
            python extract.py
          else
            curl -fL --retry 4 --retry-all-errors "$URL2" -o out/metabolome_normalized_from_cbioportal.txt
            printf '%s' "$SCRIPT2" | base64 -d > inspect.py
            python inspect.py
          fi
          sha256sum out/* > out/SHA256SUMS.txt
          cat out/acquisition_receipt.json
      - name: Upload acquired metabolome artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2.1.2-gbm-metabolome-acquisition
          path: out/
          retention-days: 7
