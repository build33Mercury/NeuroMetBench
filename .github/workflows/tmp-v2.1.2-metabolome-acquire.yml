name: Temporary v2.1.2 protein identifier diagnostics

on:
  push:
    branches:
      - tmp-v2.1.2-metabolome-acquisition

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect frozen serine-core identifiers in Wang protein matrix
        shell: bash
        run: |
          set -euo pipefail
          URL='https://media.githubusercontent.com/media/cBioPortal/datahub/refs/heads/master/public/gbm_cptac_2021/data_protein_quantification.txt'
          curl -fL --retry 4 --retry-all-errors "$URL" -o protein.txt
          echo 'HEADER:'
          head -n 1 protein.txt | cut -c1-500
          echo 'TARGET STRING MATCHES:'
          grep -i -E 'PHGDH|PSAT1|PSPH' protein.txt | cut -c1-1200 || true
          echo 'FIRST 5 DATA IDS:'
          sed -n '2,6p' protein.txt | cut -f1
          echo 'COUNTS:'
          wc -l protein.txt
          sha256sum protein.txt
