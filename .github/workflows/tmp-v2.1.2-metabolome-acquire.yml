name: Temporary v2.1.2 clinical IDH acquisition

on:
  push:
    branches:
      - tmp-v2.1.2-metabolome-acquisition

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Acquire Wang-derived clinical files and inspect IDH fields
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          BASE='https://media.githubusercontent.com/media/cBioPortal/datahub/refs/heads/master/public/gbm_cptac_2021'
          curl -fL --retry 4 --retry-all-errors "$BASE/data_clinical_sample.txt" -o clinical_sample.txt
          curl -fL --retry 4 --retry-all-errors "$BASE/data_clinical_patient.txt" -o clinical_patient.txt
          cp clinical_sample.txt out/
          cp clinical_patient.txt out/
          sha256sum clinical_sample.txt clinical_patient.txt > out/clinical_SHA256SUMS.txt
          echo 'SAMPLE FIRST 12 LINES:'
          head -n 12 clinical_sample.txt | cut -c1-2000
          echo 'PATIENT FIRST 12 LINES:'
          head -n 12 clinical_patient.txt | cut -c1-2000
          echo 'IDH MATCHES:'
          grep -in -E 'IDH|idh' clinical_sample.txt | head -n 20 || true
          grep -in -E 'IDH|idh' clinical_patient.txt | head -n 20 || true
      - name: Upload clinical files
        uses: actions/upload-artifact@v4
        with:
          name: v2.1.2-gbm-clinical-idh
          path: out/
          retention-days: 7
